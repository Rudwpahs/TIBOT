name: TiBot CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'fix/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: CLI smoke test
        run: python app.py --help
      - name: Legacy modules import without secrets
        run: env -u TIBOT_NEIS_API_KEY python -c "import SchoolApi"
